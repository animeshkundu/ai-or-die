name: Update Visual Baselines

# Regenerate the Linux and Windows Playwright visual-regression baselines and
# commit them back to the branch.
#
# Trigger: push a commit whose message contains "[update-baselines]". (A
# workflow_dispatch trigger only works once the file is on the default branch;
# the marker keeps this self-contained on a feature branch and inert on normal
# pushes.) Mirrors the test-browser-visual job in ci.yml, plus --update-snapshots
# and a commit-back step.
#
# The marker is checked in a step, not in a job-level `if:`. A job-level
# condition makes the job report "skipped", which branch protection and CI
# gates read as not-green. Guarding at step level lets both jobs run and
# conclude "success" as a cheap no-op when the marker is absent, while the
# work still only happens when the marker is present.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

# Scoped to (ref, commit) and non-cancelling, for the same reason the marker is
# checked in a step rather than a job-level `if:`: this workflow must never
# report anything but "success" for a commit that is fine.
#
# A ref-scoped group with cancel-in-progress made the workflow cancel ITSELF.
# When two push events arrive for the SAME head commit, both runs land in the
# ref-scoped group and the newer one cancels the older — leaving "cancelled"
# check runs attached to the current head SHA even though the surviving run for
# that identical SHA went green. CI gates read the cancelled pair and see red.
#
# Keying on the SHA keeps unrelated commits out of each other's way, and
# cancel-in-progress: false makes a duplicate run for one commit queue behind
# its twin instead of killing it. The group is still worth keeping: when the
# marker is present these jobs `git push` baselines back to the branch, and two
# concurrent runs for one commit would race on that push.
concurrency:
  group: update-visual-baselines-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  generate-baselines:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check for [update-baselines] marker
        id: guard
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -qF '[update-baselines]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Marker found; regenerating visual baselines."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No [update-baselines] marker in the head commit message; nothing to do."
          fi
          # Playwright suffixes every snapshot with the platform it was taken
          # on. Each matrix leg must upload ONLY its own platform's files:
          # the collector below merges the artifacts into one directory, so a
          # leg that uploaded the whole snapshot set would overwrite the other
          # leg's freshly regenerated images with its own stale checked-out
          # copies, and the commit step would then see no change at all.
          case "$RUNNER_OS" in
            Windows) echo "snapshot_suffix=win32" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "snapshot_suffix=darwin" >> "$GITHUB_OUTPUT" ;;
            *)       echo "snapshot_suffix=linux" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        # persist-credentials (default true) keeps the token so we can push.
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
        if: steps.guard.outputs.enabled == 'true'
      - name: Cache Playwright browsers
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.guard.outputs.enabled == 'true'
        shell: bash
        run: |
          for i in 1 2 3; do
            npx playwright install chromium --with-deps && exit 0
            echo "::warning::playwright install attempt $i failed; retrying in 10s"; sleep 10
          done
          exit 1
      - name: Restore local models (STT, cached)
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/cache-models
        with:
          models: stt
      - name: Regenerate visual baselines
        if: steps.guard.outputs.enabled == 'true'
        run: npx playwright test --config e2e/playwright.config.js --project visual-regression --update-snapshots
      - name: Upload regenerated baselines (artifact)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.guard.outputs.enabled == 'true' }}
        with:
          name: visual-baselines-${{ runner.os }}
          # Platform-scoped on purpose — see the suffix note in the guard step.
          path: e2e/tests/**/*-snapshots/*-${{ steps.guard.outputs.snapshot_suffix }}.png
          retention-days: 14

  commit-baselines:
    needs: generate-baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check for [update-baselines] marker
        id: guard
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -qF '[update-baselines]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No [update-baselines] marker in the head commit message; nothing to commit."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - name: Download regenerated baselines
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: visual-baselines-*
          path: e2e/tests
          merge-multiple: true
      - name: Commit and push updated baselines
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test: regenerate visual baselines"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed regenerated baselines."
          fi
