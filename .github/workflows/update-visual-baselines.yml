name: Update Visual Baselines

# Regenerate the Linux and Windows Playwright visual-regression baselines and
# commit them back to the branch.
#
# Trigger: push a commit whose message contains "[update-baselines]". (A
# workflow_dispatch trigger only works once the file is on the default branch;
# the marker keeps this self-contained on a feature branch and inert on normal
# pushes.) Mirrors the test-browser-visual job in ci.yml, plus --update-snapshots
# and a commit-back step.
#
# The marker is checked in a step, not in a job-level `if:`. A job-level
# condition makes the job report "skipped", which branch protection and CI
# gates read as not-green. Guarding at step level lets both jobs run and
# conclude "success" as a cheap no-op when the marker is absent, while the
# work still only happens when the marker is present.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: update-visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-baselines:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check for [update-baselines] marker
        id: guard
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -qF '[update-baselines]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Marker found; regenerating visual baselines."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No [update-baselines] marker in the head commit message; nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        # persist-credentials (default true) keeps the token so we can push.
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
        if: steps.guard.outputs.enabled == 'true'
      - name: Cache Playwright browsers
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.guard.outputs.enabled == 'true'
        shell: bash
        run: |
          for i in 1 2 3; do
            npx playwright install chromium --with-deps && exit 0
            echo "::warning::playwright install attempt $i failed; retrying in 10s"; sleep 10
          done
          exit 1
      - name: Restore local models (STT, cached)
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/cache-models
        with:
          models: stt
      - name: Regenerate visual baselines
        if: steps.guard.outputs.enabled == 'true'
        run: npx playwright test --config e2e/playwright.config.js --project visual-regression --update-snapshots
      - name: Upload regenerated baselines (artifact)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.guard.outputs.enabled == 'true' }}
        with:
          name: visual-baselines-${{ runner.os }}
          path: e2e/tests/**/*-snapshots/
          retention-days: 14

  commit-baselines:
    needs: generate-baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check for [update-baselines] marker
        id: guard
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -qF '[update-baselines]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No [update-baselines] marker in the head commit message; nothing to commit."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - name: Download regenerated baselines
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: visual-baselines-*
          path: e2e/tests
          merge-multiple: true
      - name: Commit and push updated baselines
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test: regenerate visual baselines"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed regenerated baselines."
          fi
