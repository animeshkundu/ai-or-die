name: CI

# Trigger policy (per user directive, 2026-05-27): PR-only.
# Avoid auto-fanout on every push — feature-branch pushes are throwaway
# and main-push CI is redundant with the PR run that just merged.
# Release/publish on main push lives in release-on-main.yml.
# Use workflow_dispatch for manual re-runs (e.g. retry a flaky job).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flake_inventory_runs:
        description: Consecutive full-suite runs per OS (0 disables inventory job)
        required: false
        default: '0'

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flake-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flake_inventory_runs != '0' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/run-flake-inventory.js ${{ inputs.flake_inventory_runs }} flake-inventory-artifacts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: flake-inventory-${{ matrix.os }}
          path: flake-inventory-artifacts/
          retention-days: 14

  # Compile-check the Go mesh sidecar on PRs (the release workflow only builds it
  # on push to main, so without this a Go break would not surface until release).
  mesh-sidecar-build:
    name: mesh-sidecar-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: go mod tidy + vet + test + build
        working-directory: mesh
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=ci" -o /tmp/aiordie-mesh .
          echo "mesh sidecar built OK"

  test:
    # Explicit name so branch protection can reliably reference the check
    # context as "CI / test (ubuntu-latest)" etc. (See
    # docs/audits/ci-branch-protection-checklist.md.)
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # The mesh sidecar's contentHash must match its committed lock. This is the
      # deterministic, un-bypassable build-signal: change mesh/ source without
      # regenerating the lock and CI fails here (run `npm run mesh:lock`).
      - name: Verify mesh sidecar lock is current
        run: node scripts/mesh-lock.js --check
      # Verify the @vscode/ripgrep postinstall succeeded — fail CI fast
      # with an actionable message instead of letting 50 spec failures
      # downstream obscure the root cause (corp proxy blocked the
      # postinstall fetch, --ignore-scripts ran, antivirus quarantined
      # the binary, etc.). See ADR-0018.
      - name: Verify bundled ripgrep
        run: node -e "const p = require('@vscode/ripgrep').rgPath; require('fs').accessSync(p, require('fs').constants.X_OK); console.log('rg OK:', p)"
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
        continue-on-error: true

  test-bun-model-host:
    name: model-host Bun canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'canary'
      - run: npm ci
      - run: bun test/fixtures/bun-model-host-smoke.js

  # Warm the STT model cache ONCE before the browser jobs so none of them pay
  # the ~640MB on-demand download inside their per-job budget (a timed-out job
  # never saves the cache, so per-job-only caching could never self-warm the
  # slow jobs).
  #
  # Deliberately SEPARATE from browser prewarming. The model download has never
  # been the problem — it comes from a fast host and completes reliably. Sharing
  # a job with the browser install put a healthy 640MB transfer in the same
  # timeout and cache-quota failure domain as the failing one, so a browser
  # stall took the model cache down with it for no reason.
  prewarm-stt:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Prewarm STT model cache
        uses: ./.github/actions/cache-models
        with:
          models: stt

  # Warm the Playwright browser cache, ONE BROWSER PER CELL.
  #
  # Why one browser per cell rather than one job installing the set:
  #   - The cache key encodes the browser set, so a "chromium webkit" entry does
  #     NOT serve a consumer that asks for "chromium". Publishing one entry per
  #     browser is what actually makes consumers hit.
  #   - `actions/cache` saves with post-if: success(), so when a two-browser
  #     install died on the second browser the first one's completed download
  #     was thrown away. One browser per job removes the partial-failure case.
  #   - The two downloads now run concurrently, so wall-clock is one browser
  #     (~10 min at the measured rate) rather than two (~20 min).
  #
  # macOS is here because longevity-smoke runs a macOS cell and had no producer
  # anywhere — it could only ever cold-download on its own budget.
  prewarm-browsers:
    name: prewarm ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
          # For longevity-smoke's macOS cell; no chromium consumer in this file.
          - os: macos-latest
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Prewarm ${{ matrix.browser }}
        uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ matrix.browser }}
          # ONE long attempt. GitHub scopes caches to the creating branch, its
          # PR base, or the default branch, and nothing in this repo runs on
          # main, so every PR branch starts fully cold. At the ~0.28 MB/s
          # measured from these runners a ~170MB browser needs ~10 min, so give
          # it 20 and let the single attempt finish rather than restarting.
          attempt-timeout-ms: '1200000'
          attempts: '1'

  # ---------------------------------------------------------------------------
  # Derived browser matrix.
  #
  # Replaces 17 hand-written jobs (~857 lines) that differed only in --project.
  # Two problems with that scheme, both of which bit us:
  #   1. A MISSING job is invisible in review — nothing looks wrong. Four
  #      projects had drifted to ZERO coverage that way: file-browser-v2,
  #      journey, journey-auth, journey-auth-regressions.
  #   2. Eight of those jobs gated on `[test, prewarm-models]`, so a red unit
  #      job silently masked an entire downstream tier for most of a large PR.
  #      When it finally went green those jobs immediately exposed real bugs.
  #
  # The matrix is generated from playwright.config.js: a new project is covered
  # by default, and anything skipped must be declared with a reason in
  # scripts/ci-browser-matrix.js. Browser (chromium vs webkit) comes from each
  # project's own use.browserName rather than a name heuristic.
  # ---------------------------------------------------------------------------
  browser-matrix:
    name: discover browser projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      # Fails if an exclusion names a project that no longer exists, so the
      # exclusion list cannot quietly rot back into a coverage hole.
      - run: node scripts/ci-browser-matrix.js --check
      - id: gen
        run: echo "matrix=$(node scripts/ci-browser-matrix.js)" >> "$GITHUB_OUTPUT"

  test-browser:
    name: browser (${{ matrix.label }}, ${{ matrix.os }})
    # prewarm-* are OPTIMISATIONS, not gates. They populate the shared caches so
    # these cells restore instead of each cold-downloading concurrently.
    #
    # But `needs:` on a matrix job is an AGGREGATE: a single failed prewarm cell
    # (say Windows) would skip ALL ~13 browser cells, including every Linux one
    # whose prewarm succeeded. fail-fast: false does not help — that governs
    # siblings inside a matrix, not this dependency edge. That is precisely the
    # masked-signal failure the old `needs:` chain caused, in a new shape.
    #
    # So: depend on them for ORDERING, then explicitly run anyway unless the
    # matrix itself could not be computed. A cold cell falls back to its own
    # bounded install, which is slower but honest.
    needs: [browser-matrix, prewarm-browsers, prewarm-stt]
    if: ${{ !cancelled() && needs.browser-matrix.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Never cancel siblings. fail-fast defaults to TRUE, which would let one
      # red project hide every other result in the matrix — the same
      # missing-signal failure the old needs: chain produced, in a new shape.
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ matrix.browser }}
      - name: Restore local models (STT, cached)
        uses: ./.github/actions/cache-models
        with:
          models: stt
      # One job runs SEVERAL projects. Every job pays checkout + setup-node +
      # npm ci (~1.5 min) before its first test, so one-job-per-project spent
      # ~28% more runner time than the layout it replaced (measured: 33 jobs /
      # 145 min before, 42 jobs / ~185 min projected). Playwright still reports
      # per project inside the job, so a failure stays attributable.
      - name: Run ${{ matrix.projects }}
        shell: bash
        run: |
          args=""
          for p in ${{ matrix.projects }}; do args="$args --project $p"; done
          npx playwright test --config e2e/playwright.config.js $args
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.label }}-${{ matrix.os }}
          path: |
            e2e/test-results/
            playwright-report/
          retention-days: 14


  test-package:
    name: test-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Package smoke test
        run: node scripts/smoke-test-package.js

  build-binary:
    name: build-binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: ai-or-die-linux-x64
          - os: windows-latest
            platform: win32
            artifact: ai-or-die-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Build SEA binary
        run: node scripts/build-sea.js
      - name: Smoke test (--help)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            ./dist/ai-or-die.exe --help || true
          else
            chmod +x ./dist/ai-or-die
            ./dist/ai-or-die --help || true
          fi
      - name: E2E test against binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            node scripts/smoke-test-binary.js ./dist/ai-or-die.exe
          else
            node scripts/smoke-test-binary.js ./dist/ai-or-die
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact || 'ai-or-die*' }}
